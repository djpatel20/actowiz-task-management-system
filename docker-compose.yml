services:
  mongodb:
    image: mongo:7
    container_name: actowiz_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: actowiz_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env.docker
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: actowiz_client
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo-data:
    name: actowiz_mongo_data
